services:
  db:
    image: ankane/pgvector
    restart: always
    container_name: kronos_db
    environment:
      POSTGRES_DB: kronos_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - n8n-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      JWT_SECRET: df0f7a7c8e2b1d3f5a7b9c1d3e5f7a9b
      DATABASE_URL: postgres://admin:admin@kronos_db:5432/kronos_db
    ports:
      - "3001:3001"
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - n8n-network  

  redis:
    image: redis:alpine
    restart: unless-stopped
    container_name: redis-n8n
    ports:
      - "6379:6379"
    networks:
      - n8n-network
    volumes:
      - redis-data:/data

  n8n-editor:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    container_name: n8n-editor
    ports:
      - "5678:5678"
    networks:
      - n8n-network
    volumes:
      - ./n8n-data:/home/node/.n8n
    depends_on:
      - db
      - redis
    env_file:
      - .env

  n8n-workers:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    container_name: n8n-workers
    ports:
      - "5676:5678"
    networks:
      - n8n-network
    volumes:
      - ./n8n-data:/home/node/.n8n
    depends_on:
      - db
      - redis
    env_file:
      - .env
    command: worker

  n8n-webhooks:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    container_name: n8n-webhooks
    ports:
      - "5677:5678"
    networks:
      - n8n-network
    volumes:
      - ./n8n-data:/home/node/.n8n
    depends_on:
      - db
      - redis
    env_file:
      - .env
    command: webhook

volumes:
  db_data:
  n8n-data:
  redis-data:

networks:
  n8n-network:
    driver: bridge
